# Runs on every push and PR. Deliberately the same gates the release runs, minus publishing — so a
# release never fails on something a PR could have caught days earlier.
name: ci

on:
  push:
    branches: ['main', 'release/**', 'feat/**', 'fix/**']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is OMITTED deliberately: the suite HANGS there, which is what was cancelling
        # main's runs at the 6h timeout long before this workflow existed (see run history).
        # package.json still declares engines >=18 — that claim is now unverified and needs a
        # decision: either fix the hang, or drop support and bump engines to >=20.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  smoke:
    name: compile a real page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      # Unit tests have been green while the actual pipeline was broken (formSelect threw
      # `options.map is not a function` on any page with a <select>). Compile something real.
      - name: lint + build
        run: |
          mkdir -p /tmp/smoke/pages
          echo "export default { name: 'smoke' };" > /tmp/smoke/site.config.mjs
          cat > /tmp/smoke/pages/smoke.page.jsx <<'JSX'
          export const meta = { title: 'Smoke', template: 'elementor_canvas' };
          export default () => (
            <box pad={0} bg="#ffffff">
              {fontLoader('Inter', [400, 700])}
              <section pad={[64, 32]}>
                <h1 size={48} weight={700} lh="56px">Smoke</h1>
                <text size={16} lh="24px">Compiled in CI.</text>
              </section>
            </box>
          );
          JSX
          node src/cli.mjs lint /tmp/smoke
          node src/cli.mjs build /tmp/smoke /tmp/smoke/out.json
          test -s /tmp/smoke/out.json

  examples:
    name: examples still build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: build every example
        run: |
          fail=0
          for d in examples/*/; do
            [ -f "$d/site.config.mjs" ] || continue
            echo "── $d"
            node src/cli.mjs build "$d" "/tmp/$(basename "$d").json" || fail=1
          done
          exit $fail
